services:
  backend:
    build:
      context: ./cerberus1
      dockerfile: Dockerfile
    container_name: cybersaarthi-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "sqlite:///./data/cybersaarthi.db"
      NEO4J_ENABLED: "false"
      SECRET_KEY: "cybersaarthi_dev_secret_key_2026_super_secure"
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      STORAGE_DIR: "./data/uploads"
      AI_PROVIDER: "heuristic"
      OCR_ENGINE: "auto"
    volumes:
      - ./cerberus1/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cybersaarthi-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cybersaarthi-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - cybersaarthi-net

networks:
  cybersaarthi-net:
    driver: bridge

volumes:
  backend-data:
